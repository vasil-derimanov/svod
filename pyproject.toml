[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svod"
version = "4.28.0"
description = "Smart Video Orientation Detector - YOLOv11 + YuNet face detection with comprehensive validation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Boris Jalov", email = "boris.jalov@gmail.com"},
]
maintainers = [
    {name = "Boris Jalov", email = "boris.jalov@gmail.com"},
]
keywords = ["video", "orientation", "detection", "ai", "computer-vision", "opencv", "yolov11", "yolo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Utilities",
]
dependencies = [
    "opencv-contrib-python>=4.8.0",  # contrib required by mediapipe
    "numpy>=1.24.0,<2",
    "ultralytics>=8.3.0",  # YOLOv11 support (Nov 2024)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.17.0",  # Fast CPU inference for YOLO ONNX models
    "mediapipe>=0.10.0",  # Face Mesh and Pose detection
    "tqdm>=4.65.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/vasil-derimanov/svod"
Documentation = "https://github.com/vasil-derimanov/svod#readme"
Repository = "https://github.com/vasil-derimanov/svod.git"
Issues = "https://github.com/vasil-derimanov/svod/issues"

[project.scripts]
svod = "video_orientation_detector:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "video_orientation_detector",
    "svod_detector",
    "svod_bootstrap",
    "svod_state",
    "svod_cli",
    "svod_statistics",
    "svod_models",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = [
    "*.onnx",
    "*.xml",
    "*.bin",
    "*.names",
    "*.pt",
    "*.csv",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=video_orientation_detector --cov=svod_detector --cov=svod_bootstrap --cov=svod_cli --cov=svod_models --cov=svod_statistics --cov=svod_state --cov-report=html --cov-report=term-missing --cov-fail-under=30"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.pyright]
exclude = [
    "test_*.py",
    "debug_*.py", 
    "performance_*.py"
]
reportMissingImports = false
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.pylance]
exclude = [
    "test_*.py",
    "debug_*.py",
    "performance_*.py"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "testing/",
    "htmlcov/",
    "build/",
    "dist/",
]
