[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svod"
version = "4.23.0"
description = "Smart Video Orientation Detector - YOLOv10 primary detector with enhanced verdict alignment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Boris", email = "boris@example.com"},
]
maintainers = [
    {name = "Boris", email = "boris@example.com"},
]
keywords = ["video", "orientation", "detection", "ai", "computer-vision", "opencv", "yolov10", "yolov8"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Utilities",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "tqdm>=4.65.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/boris/svod"
Documentation = "https://github.com/boris/svod#readme"
Repository = "https://github.com/boris/svod.git"
Issues = "https://github.com/boris/svod/issues"
Changelog = "https://github.com/boris/svod/blob/main/CHANGELOG.md"

[project.scripts]
svod = "video_orientation_detector:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = [
    "*.yaml",
    "*.caffemodel",
    "*.prototxt",
    "*.xml",
    "*.bin",
    "*.names",
    "*.cfg",
    "*.weights",
    "*.pt",
    "*.csv",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=video_orientation_detector --cov-report=html --cov-report=term-missing --cov-fail-under=15"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.pyright]
exclude = [
    "test_*.py",
    "debug_*.py", 
    "performance_*.py",
    "*_old.py",
    "video_orientation_detector_old.py"
]
reportMissingImports = false
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.pylance]
exclude = [
    "test_*.py",
    "debug_*.py",
    "performance_*.py", 
    "*_old.py",
    "video_orientation_detector_old.py"
]
