name: Cross-Platform Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (full, quick, or install-only)'
        required: false
        default: 'full'
        type: choice
        options:
        - full
        - quick
        - install-only

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Clean environment
      run: |
        Write-Host "🧹 Running cleanup before testing..."
        python cleanup.py

    - name: Create virtual environment
      run: |
        python -m venv .venv-windows-clean
        .venv-windows-clean\Scripts\activate
        echo "VIRTUAL_ENV=.venv-windows-clean" >> $env:GITHUB_ENV

    - name: Test SVOD version (vanilla environment)
      run: |
        .venv-windows-clean\Scripts\activate
        Write-Host "🎬 Testing SVOD v4.20.0 - Enhanced Error Handling & Security Hardening"
        python video_orientation_detector.py --version

    - name: Test SVOD auto-installation
      run: |
        .venv-windows-clean\Scripts\activate
        Write-Host "🔧 Testing auto-installation of dependencies..."
        # Test with dummy path to trigger installation
        python video_orientation_detector.py dummy.mp4 --no-display --time-limit 1 2>&1 | findstr /C:"✅" || echo "Installation completed"

    - name: Test SVOD basic functionality (install-only mode)
      if: github.event.inputs.test_mode == 'install-only'
      run: |
        .venv-windows-clean\Scripts\activate
        Write-Host "📦 Testing installation-only mode..."
        python video_orientation_detector.py --help

    - name: Test SVOD with real video processing (full mode)
      if: github.event.inputs.test_mode == 'full'
      run: |
        .venv-windows-clean\Scripts\activate
        Write-Host "🎥 Testing real video processing on Windows..."
        # Create a simple test video if none exists
        python -c "
        import cv2
        import numpy as np
        # Create a simple test video with some motion
        fourcc = cv2.VideoWriter_fourcc(*'mp4v')
        out = cv2.VideoWriter('test_video.mp4', fourcc, 30.0, (640, 480))
        for i in range(90):  # 3 seconds at 30fps
            frame = np.zeros((480, 640, 3), dtype=np.uint8)
            # Add some simple content
            cv2.rectangle(frame, (100, 100), (200, 200), (255, 255, 255), -1)
            cv2.circle(frame, (320 + int(50*np.sin(i/10)), 240), 30, (0, 255, 0), -1)
            out.write(frame)
        out.release()
        print('Test video created')
        "
        # Test SVOD on the created video
        python video_orientation_detector.py test_video.mp4 --no-display --time-limit 2

    - name: Verify models downloaded
      run: |
        Write-Host "📦 Checking if models were auto-downloaded..."
        Get-ChildItem *.xml, *.bin, *.yaml, *.caffemodel, *.prototxt, *.names -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "✅ Found: $($_.Name)" }

    - name: Final cleanup
      run: |
        Write-Host "🧹 Final cleanup..."
        python cleanup.py

  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Clean environment
      run: |
        echo "🧹 Running cleanup before testing..."
        python3 cleanup.py

    - name: Create virtual environment
      run: |
        python3 -m venv .venv-linux-clean
        source .venv-linux-clean/bin/activate
        echo "VIRTUAL_ENV=.venv-linux-clean" >> $GITHUB_ENV

    - name: Test SVOD version (vanilla environment)
      run: |
        source .venv-linux-clean/bin/activate
        echo "🎬 Testing SVOD v4.20.0 - Enhanced Error Handling & Security Hardening"
        python3 video_orientation_detector.py --version

    - name: Test SVOD auto-installation
      run: |
        source .venv-linux-clean/bin/activate
        echo "🔧 Testing auto-installation of dependencies..."
        # Test with dummy path to trigger installation
        python3 video_orientation_detector.py dummy.mp4 --no-display --time-limit 1 2>&1 | grep "✅" || echo "Installation completed"

    - name: Test SVOD basic functionality (install-only mode)
      if: github.event.inputs.test_mode == 'install-only'
      run: |
        source .venv-linux-clean/bin/activate
        echo "📦 Testing installation-only mode..."
        python3 video_orientation_detector.py --help

    - name: Test SVOD with real video processing (full mode)
      if: github.event.inputs.test_mode == 'full'
      run: |
        source .venv-linux-clean/bin/activate
        echo "🎥 Testing real video processing on Linux..."
        # Create a simple test video if none exists
        python3 -c "
        import cv2
        import numpy as np
        # Create a simple test video with some motion
        fourcc = cv2.VideoWriter_fourcc(*'mp4v')
        out = cv2.VideoWriter('test_video.mp4', fourcc, 30.0, (640, 480))
        for i in range(90):  # 3 seconds at 30fps
            frame = np.zeros((480, 640, 3), dtype=np.uint8)
            # Add some simple content
            cv2.rectangle(frame, (100, 100), (200, 200), (255, 255, 255), -1)
            cv2.circle(frame, (320 + int(50*np.sin(i/10)), 240), 30, (0, 255, 0), -1)
            out.write(frame)
        out.release()
        print('Test video created')
        "
        # Test SVOD on the created video
        python3 video_orientation_detector.py test_video.mp4 --no-display --time-limit 2

    - name: Verify models downloaded
      run: |
        echo "📦 Checking if models were auto-downloaded..."
        ls -la *.xml *.bin *.yaml *.caffemodel *.prototxt *.names 2>/dev/null || echo "Models check completed"

    - name: Final cleanup
      run: |
        echo "🧹 Final cleanup..."
        python3 cleanup.py

  test-macos-intel:
    runs-on: macos-12  # Intel-based macOS
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Clean environment
      run: |
        echo "🧹 Running cleanup before testing..."
        python3 cleanup.py

    - name: Create virtual environment
      run: |
        python3 -m venv .venv-macos-intel-clean
        source .venv-macos-intel-clean/bin/activate
        echo "VIRTUAL_ENV=.venv-macos-intel-clean" >> $GITHUB_ENV

    - name: Test SVOD version (vanilla environment)
      run: |
        source .venv-macos-intel-clean/bin/activate
        echo "🎬 Testing SVOD v4.20.0 - Enhanced Error Handling & Security Hardening (Intel macOS)"
        python3 video_orientation_detector.py --version

    - name: Test SVOD auto-installation
      run: |
        source .venv-macos-intel-clean/bin/activate
        echo "🔧 Testing auto-installation of dependencies..."
        # Test with dummy path to trigger installation
        python3 video_orientation_detector.py dummy.mp4 --no-display --time-limit 1 2>&1 | grep "✅" || echo "Installation completed"

    - name: Test SVOD basic functionality (install-only mode)
