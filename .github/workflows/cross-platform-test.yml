name: Cross-Platform Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} (${{ matrix.install }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned stack (torch 2.8, OpenVINO 2024.6) publishes 3.11 and 3.12 wheels here.
          - os: ubuntu-latest
            python: "3.11"
            install: full
          - os: ubuntu-latest
            python: "3.12"
            install: full
          - os: windows-latest
            python: "3.11"
            install: full
          - os: macos-latest
            python: "3.11"
            install: full
          # torch 2.8 has no macOS x86_64 wheel, so Intel macOS stays a version smoke test.
          - os: macos-13
            python: "3.11"
            install: smoke

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: matrix.install == 'full'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show version
        run: python video_orientation_detector.py --version

      - name: Run pytest
        if: matrix.install == 'full'
        env:
          PYTHONIOENCODING: utf-8
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          python -m pytest tests/ --cov=video_orientation_detector --cov=svod_detector --cov=svod_bootstrap --cov=svod_cli --cov=svod_models --cov=svod_statistics --cov=svod_state --cov-report=term-missing --cov-fail-under=30
