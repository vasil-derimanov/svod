name: macOS Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Clean environment
      run: |
        echo "🧹 Running cleanup before testing..."
        python3 cleanup.py
    
    - name: Create virtual environment
      run: |
        python3 -m venv .venv-macos-clean
        source .venv-macos-clean/bin/activate
        echo "VIRTUAL ENV" >> $GITHUB_PATH
    
    - name: Test SVOD version (vanilla environment)
      run: |
        source .venv-macos-clean/bin/activate
        echo "🎬 Testing SVOD v4.20.0 with enhanced DNN validation..."
        python3 video_orientation_detector.py --version
    
    - name: Test SVOD basic functionality
      run: |
        source .venv-macos-clean/bin/activate
        echo "🔧 Testing basic functionality with auto-installation..."
        # Test with dummy video path (will fail gracefully but test installation)
        python3 video_orientation_detector.py /dev/null --no-display --time-limit 1 || echo "✅ Expected failure - no video file, but installation works"
    
    - name: Verify models downloaded
      run: |
        echo "📦 Checking if models were auto-downloaded..."
        ls -la *.cfg *.weights *.xml *.bin *.yaml *.prototxt *.caffemodel 2>/dev/null || echo "⚠️ Models not downloaded (expected for /dev/null test)"
        
    - name: Final cleanup
      run: |
        echo "🧹 Final cleanup..."
        python3 cleanup.py