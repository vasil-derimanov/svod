version: '3.8'

services:
  svod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svod-detector
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "video_orientation_detector.py", "--help"]
    restart: unless-stopped

